name: ci
on:
  pull_request:
  push:
    branches: [release, testing, nightly]
  workflow_dispatch:
    inputs:
      pr-number:
        description: PR number for guarded CI
        type: string
        default: ''
      expected-head-sha:
        description: Exact PR commit
        type: string
        default: ''
      expected-default-sha:
        description: Exact default-branch commit
        type: string
        default: ''
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: edbfi/automation/actions/dispatch-guard@v2.0.0
        with:
          token: ${{ github.token }}
          pr-number: ${{ inputs.pr-number }}
          expected-head-sha: ${{ inputs.expected-head-sha }}
          expected-default-sha: ${{ inputs.expected-default-sha }}
  hygiene:
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 -m unittest discover -s tools -p 'test_*.py'
      - run: bash -n tools/smoke.sh
      - name: Workflow lint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint"
      - name: Commit conventions and sign-off
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          base="$BASE"
          if [[ -z "$base" || "$base" == 0000000000000000000000000000000000000000 ]]; then
            base="$(git rev-parse "$HEAD^")"
          fi
          for commit in $(git rev-list "$base..$HEAD"); do
            git show -s --format=%s "$commit" | grep -Eq '^(feat|fix|chore|docs|test|refactor|perf|build|ci|style|revert)(\([^)]*\))?!?: .+'
            author="$(git show -s --format='%an <%ae>' "$commit")"
            git show -s --format=%B "$commit" | grep -Fx "Signed-off-by: $author"
          done
      - run: git diff --exit-code HEAD
  image:
    needs: guard
    uses: ./.github/workflows/build-on-call.yml
    with:
      image: ${{ github.base_ref || (inputs.pr-number != '' && github.event.repository.default_branch) || github.ref_name }}
      ref: ${{ github.sha }}
  required:
    name: ci / required
    if: always()
    needs: [guard, hygiene, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: edbfi/automation/actions/dispatch-guard@v2.0.0
        with:
          token: ${{ github.token }}
          pr-number: ${{ inputs.pr-number }}
          expected-head-sha: ${{ inputs.expected-head-sha }}
          expected-default-sha: ${{ inputs.expected-default-sha }}
      - uses: edbfi/automation/actions/gate@v2.0.0
        with:
          needs: ${{ toJSON(needs) }}
          required: guard hygiene image
defaults:
  run:
    shell: bash
